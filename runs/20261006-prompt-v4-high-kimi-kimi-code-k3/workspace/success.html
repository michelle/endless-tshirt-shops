<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order confirmed — Written in the Stars</title>
<link rel="stylesheet" href="/assets/styles.css">
<style>
  .confirm { max-width: 560px; margin: 80px auto; background: var(--panel); border: 1px solid #262d47; border-radius: 14px; padding: 40px; text-align: center; }
  .confirm h1 { color: var(--accent); font-size: 26px; margin-bottom: 14px; }
  .confirm p { color: var(--muted); line-height: 1.6; margin-bottom: 10px; }
  .status-line { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 13px; letter-spacing: 1px; color: var(--ink); background: #0f1322; border-radius: 8px; padding: 12px; margin-top: 18px; }
  .confirm a { color: var(--accent); }
</style>
</head>
<body>
<div class="confirm">
  <h1>✦ Thank you — your sky is being printed</h1>
  <p id="summary">Your payment went through. We're sending your one-of-a-kind star map to the print house now.</p>
  <div class="status-line" id="status">Checking your order…</div>
  <p style="margin-top:22px"><a href="/">← Design another shirt</a></p>
</div>
<script>
(function () {
  var sessionId = new URLSearchParams(location.search).get("session_id");
  var statusEl = document.getElementById("status");
  if (!sessionId) { statusEl.textContent = "No session id in URL."; return; }
  var tries = 0;
  function poll() {
    fetch("/api/status?session_id=" + encodeURIComponent(sessionId))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.error) { statusEl.textContent = "Status: " + d.error; return; }
        if (d.paymentStatus !== "paid") {
          statusEl.textContent = "Payment status: " + d.paymentStatus;
        } else if (d.prodigiOrderId) {
          statusEl.textContent = "Print order " + d.prodigiOrderId + " · stage: " + (d.prodigiStatus || "received");
          if (d.design) document.getElementById("summary").textContent =
            "Your star map — “" + d.design.title + "” over " + (d.design.place || "your place") + " — is in the print queue.";
          return; // done
        } else if (d.fulfillment && d.fulfillment.error) {
          statusEl.textContent = "Print submission pending: " + d.fulfillment.error;
        } else {
          statusEl.textContent = "Payment confirmed · sending to print…";
        }
        if (++tries < 15) setTimeout(poll, 3000);
      })
      .catch(function () { if (++tries < 15) setTimeout(poll, 3000); });
  }
  poll();
})();
</script>
</body>
</html>
