<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23f2cf82' d='M12 0Q13.6 9.4 24 12Q13.6 14.6 12 24Q10.4 14.6 0 12Q10.4 9.4 12 0Z'/%3E%3C/svg%3E"><link rel="stylesheet" href="/css/style.css"><title>Test payment — Asterism</title><meta name="robots" content="noindex"></head>
<body><main id="main" class="page"><div class="wrap" style="max-width:880px">
<div class="banner"><b>Test mode.</b> This stands in for the real payment page until Stripe is connected. No money moves.</div>
<div class="checkout" style="grid-template-columns:1fr 1fr">
<form class="panel" id="f" novalidate>
  <h3>Pay with card</h3>
  <div class="field"><label for="num">Card number</label><input type="text" id="num" inputmode="numeric" autocomplete="off" placeholder="4242 4242 4242 4242"></div>
  <div class="row2"><div class="field"><label for="exp">Expiry</label><input type="text" id="exp" placeholder="MM/YY" autocomplete="off"></div><div class="field"><label for="cvc">CVC</label><input type="text" id="cvc" inputmode="numeric" placeholder="123" autocomplete="off"></div></div>
  <div class="err" id="err" role="alert"></div>
  <button class="btn block" id="go" type="submit" style="margin-top:12px">Pay</button>
  <p class="hint" style="margin-top:14px">Test cards: <b>4242 4242 4242 4242</b> succeeds · <b>4000 0000 0000 0002</b> is declined · <b>4000 0000 0000 9995</b> has insufficient funds. Any future expiry, any CVC.</p>
</form>
<aside class="panel"><h3>Order summary</h3><div id="sum" style="margin-top:12px"></div></aside>
</div></div></main>
<script src="/js/pay-demo.js"></script></body></html>
