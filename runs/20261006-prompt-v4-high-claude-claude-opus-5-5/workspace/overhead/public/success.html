<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank you — Overhead</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230d1020'/%3E%3Cpath d='M16 5Q17.5 14.5 27 16Q17.5 17.5 16 27Q14.5 17.5 5 16Q14.5 14.5 16 5Z' fill='%23D2AE6A'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header"><a class="brand" href="/"><span class="brand-mark">✦</span> Overhead</a></header>
  <main class="receipt">
    <div class="preview-stage" id="stage"><div class="loading">Loading your sky…</div></div>
    <div>
      <p class="eyebrow" id="eyebrow">Order received</p>
      <h1 id="title">Thank you. Your sky is on its way to the printer.</h1>
      <p class="lede" id="lede" style="margin:0">We're confirming your payment…</p>
      <ul class="status-list">
        <li id="st-paid">Payment confirmed</li>
        <li id="st-print">Sent to our print partner</li>
        <li id="st-ship">Printed &amp; shipped (usually 2–5 days to print, then 5–12 days in transit)</li>
      </ul>
      <p class="mono" id="refs"></p>
      <p><a href="/">← Design another</a></p>
    </div>
  </main>
  <script type="module" src="/success.js"></script>
</body>
</html>
