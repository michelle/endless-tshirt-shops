<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ONEOFONE — order status</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="nav">
  <div class="brand"><a href="/" style="color:inherit;text-decoration:none">ONE<span class="slash">/</span>OF<span class="slash">/</span>ONE</a></div>
  <div class="nav-tag">order status</div>
</header>
<div class="status-wrap">
  <div class="status-card" id="card">Loading…</div>
</div>
<script>
(function () {
  const id = location.pathname.split('/').pop();
  const card = document.getElementById('card');
  const result = new URLSearchParams(location.search).get('r');

  function badge(txt, cls) { return `<span class="badge ${cls}">${txt}</span>`; }

  function render(o) {
    const pay = o.payment.status === 'paid'
      ? badge('PAID', 'ok')
      : o.payment.status === 'failed'
        ? badge('PAYMENT FAILED', 'err')
        : badge('AWAITING PAYMENT', 'wait');
    const f = o.fulfillment;
    let ful;
    if (f.status === 'submitted') ful = badge('SENT TO PRINTERS', 'ok');
    else if (f.status === 'submitting') ful = badge('SENDING TO PRINTERS…', 'wait');
    else if (f.status === 'error') ful = badge('FULFILLMENT ERROR', 'err');
    else ful = badge('NOT SUBMITTED', 'wait');

    const steps = [];
    steps.push(`<li class="${o.payment.status === 'paid' ? 'done' : o.payment.status === 'failed' ? 'bad' : ''}"><span class="dot"></span><span>Payment ${o.payment.status}${o.payment.gatewayTxnId ? ` · gateway txn ${o.payment.gatewayTxnId}` : ''}</span></li>`);
    steps.push(`<li class="${f.status === 'submitted' ? 'done' : f.status === 'error' ? 'bad' : ''}"><span class="dot"></span><span>Print order submitted to Prodigi${f.prodigiOrderId ? ` · <span class="mono">${f.prodigiOrderId}</span>` : ''}${f.error ? `<br>${f.error}` : ''}</span></li>`);
    if (f.prodigiStage) {
      const d = f.prodigiDetails || {};
      const detail = Object.entries(d).map(([k, v]) => `${k}: ${v}`).join(' · ');
      steps.push(`<li class="done"><span class="dot"></span><span>Prodigi status: <strong>${f.prodigiStage}</strong>${detail ? `<br><span class="mono" style="font-size:12px">${detail}</span>` : ''}</span></li>`);
    }
    if (f.shipments && f.shipments.length) {
      steps.push(`<li class="done"><span class="dot"></span><span>Shipped: ${f.shipments.map((s) => s.carrier && s.carrier.name || 'carrier').join(', ')}</span></li>`);
    }

    card.innerHTML = `
      <div class="status-head">
        <img src="/art/${o.designId}.png" alt="your one-of-one artwork" onerror="this.src='/api/design.svg?word=${encodeURIComponent(o.word)}&palette=${o.paletteId}'">
        <div class="status-meta">
          <h2>“${o.word}”</h2>
          <div class="mono" style="color:var(--dim);font-size:13px">edition 1 of 1 · Nº ${o.edition}</div>
          <div style="margin-top:10px;color:var(--dim);font-size:14px">Bella+Canvas 3001 · ${o.shirtColor} · size ${o.size.toUpperCase()} · $${o.priceUsd.toFixed(2)}</div>
          <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">${pay} ${ful}</div>
          ${result === 'paid' ? '<p style="color:#43d17c">Payment confirmed — your artwork is at the printers.</p>' : ''}
          ${result === 'failed' ? '<p style="color:#ff9a9a">Payment did not complete. Nothing was sent to print. Go back and try again — your design is unchanged.</p>' : ''}
        </div>
      </div>
      <ul class="timeline">${steps.join('')}</ul>
      <p style="color:var(--dim);font-size:12px;margin-top:18px">This page refreshes automatically. Order <span class="mono">${o.id}</span></p>`;
  }

  async function poll() {
    try {
      const r = await fetch(`/api/orders/${id}`);
      if (!r.ok) { card.textContent = 'Order not found.'; return; }
      render(await r.json());
    } catch (e) { /* keep polling */ }
    setTimeout(poll, 4000);
  }
  poll();
})();
</script>
</body>
</html>
