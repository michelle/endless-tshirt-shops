  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;

}

  left: 0;

  height: 16px;

  border-radius: var(--radius-full);

}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {

}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {

  padding: 0;

      color-mix(in srgb, var(--foreground) 7%, transparent)

}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);

}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {

  .form-select {
    min-width: 44px;
    min-height: 44px;

  }

  }

    [type=&quot;time&quot;],

    left: 50%;

    height: 44px;

  }

  }

    height: 44px;

  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {

}

  flex: none;
  margin: 0 !important;

}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;script&gt;
(() =&gt; {
  const runs = [
    {model:&quot;GPT-6 Astra&quot;, finished:&quot;yes&quot;, reported:&quot;yes&quot;, durable:&quot;yes&quot;, payment:&quot;unknown&quot;, order:&quot;unknown&quot;, react:&quot;19.2.6&quot;, next:&quot;16.3.4&quot;, stripe:null},
    {model:&quot;GPT-6 Sol&quot;, finished:&quot;yes&quot;, reported:&quot;yes&quot;, durable:&quot;yes&quot;, payment:&quot;unknown&quot;, order:&quot;unknown&quot;, react:&quot;19.2.6&quot;, next:&quot;16.3.4&quot;, stripe:null},
    {model:&quot;GPT-6 Luna&quot;, finished:&quot;yes&quot;, reported:&quot;yes&quot;, durable:&quot;yes&quot;, payment:&quot;unknown&quot;, order:&quot;unknown&quot;, react:&quot;19.2.6&quot;, next:&quot;16.3.4&quot;, stripe:null},
    {model:&quot;Claude Fable 5.1&quot;, finished:&quot;yes&quot;, reported:&quot;yes&quot;, durable:&quot;yes&quot;, payment:&quot;yes&quot;, order:&quot;yes&quot;, react:&quot;19.2.8&quot;, next:&quot;16.3.8&quot;, stripe:&quot;^23.0.0&quot;, orderCount:2},
    {model:&quot;Claude Opus 5.5&quot;, finished:&quot;yes&quot;, reported:&quot;yes&quot;, durable:&quot;yes&quot;, payment:&quot;unknown&quot;, order:&quot;unknown&quot;, react:&quot;^19.3.0&quot;, next:&quot;^16.3.8&quot;, stripe:&quot;^23.0.0&quot;},
    {model:&quot;Claude Sonnet 5.5&quot;, finished:&quot;yes&quot;, reported:&quot;yes&quot;, durable:&quot;yes&quot;, payment:&quot;unknown&quot;, order:&quot;unknown&quot;, react:null, next:null, stripe:&quot;^23.0.0&quot;},
    {model:&quot;Kimi K3&quot;, finished:&quot;yes&quot;, reported:&quot;yes&quot;, durable:&quot;yes&quot;, payment:&quot;unknown&quot;, order:&quot;unknown&quot;, react:null, next:null, stripe:null, note:&quot;Raw process status timed out after the final report because child processes remained open.&quot;},
    {model:&quot;GLM 5.3 High&quot;, finished:&quot;no&quot;, reported:&quot;no&quot;, durable:&quot;no&quot;, payment:&quot;unknown&quot;, order:&quot;unknown&quot;, react:null, next:null, stripe:null},
    {model:&quot;DeepSeek V4.1 Flash&quot;, finished:&quot;yes&quot;, reported:&quot;yes&quot;, durable:&quot;no&quot;, payment:&quot;yes&quot;, order:&quot;yes&quot;, react:&quot;19.1.0&quot;, next:&quot;15.5.27&quot;, stripe:&quot;18.4.0&quot;, orderCount:6, note:&quot;Durable URL returned HTTP 200, but the client crashed during initialization.&quot;},
    {model:&quot;Qwen 3.8 Max&quot;, finished:&quot;yes&quot;, reported:&quot;no&quot;, durable:&quot;yes&quot;, payment:&quot;unknown&quot;, order:&quot;unknown&quot;, react:null, next:null, stripe:&quot;^23.0.0&quot;},
    {model:&quot;MiniMax M3&quot;, finished:&quot;yes&quot;, reported:&quot;yes&quot;, durable:&quot;yes&quot;, payment:&quot;unknown&quot;, order:&quot;unknown&quot;, react:null, next:null, stripe:&quot;^23.0.0&quot;},
    {model:&quot;Gemini 3.8 Flash&quot;, finished:&quot;yes&quot;, reported:&quot;yes&quot;, durable:&quot;yes&quot;, payment:&quot;yes&quot;, order:&quot;yes&quot;, react:null, next:null, stripe:&quot;^23.0.0&quot;, orderCount:1, note:&quot;Succeeded PaymentIntents were observed even though retained Checkout Sessions were unpaid.&quot;},

  const tooltip = d3.select(&quot;.suite-viz .tooltip&quot;);
  const labels = {yes:&quot;Observed&quot;, no:&quot;No&quot;, unknown:&quot;Unknown&quot;};
  const columns = [&quot;finished&quot;, &quot;reported&quot;, &quot;durable&quot;, &quot;payment&quot;, &quot;order&quot;];
  const details = {

    payment: &quot;At least one succeeded Stripe PaymentIntent was observed&quot;,

  const rows = d3.select(&quot;#outcomes-table tbody&quot;).selectAll(&quot;tr&quot;)
    .data(runs).join(&quot;tr&quot;);
  rows.append(&quot;td&quot;).text(d =&gt; d.model);
  columns.forEach(col =&gt; {
    rows.append(&quot;td&quot;)
      .attr(&quot;class&quot;, &quot;evidence-cell&quot;)
      .html(d =&gt; `&lt;span class=&quot;mark ${d[col]}&quot;&gt;&lt;/span&gt;&lt;span class=&quot;state-text ${d[col]}&quot;&gt;${labels[d[col]]}${col === &quot;order&quot; &amp;&amp; d.orderCount ? ` (${d.orderCount})` : &quot;&quot;}&lt;/span&gt;`)
      .attr(&quot;tabindex&quot;, 0)
      .attr(&quot;aria-label&quot;, d =&gt; `${d.model}: ${details[col]} — ${labels[d[col]]}${col === &quot;order&quot; &amp;&amp; d.orderCount ? `, ${d.orderCount} orders` : &quot;&quot;}`)
      .on(&quot;mouseenter focus&quot;, (event, d) =&gt; {
        const cell = event.currentTarget;
        const idx = Array.from(cell.parentNode.children).indexOf(cell) - 1;
        const key = columns[idx];
        const extra = d.note &amp;&amp; (key === &quot;finished&quot; || key === &quot;durable&quot; || key === &quot;payment&quot;) ? `&lt;br&gt;${d.note}` : &quot;&quot;;
        tooltip.style(&quot;opacity&quot;, 1).html(`&lt;strong&gt;${d.model}&lt;/strong&gt;&lt;br&gt;${details[key]}: ${labels[d[key]]}${key === &quot;order&quot; &amp;&amp; d.orderCount ? ` (${d.orderCount})` : &quot;&quot;}.${extra}`);
      })
      .on(&quot;mousemove&quot;, event =&gt; tooltip.style(&quot;left&quot;, `${Math.min(event.clientX + 14, window.innerWidth - 294)}px`).style(&quot;top&quot;, `${event.clientY + 14}px`))
      .on(&quot;mouseleave blur&quot;, () =&gt; tooltip.style(&quot;opacity&quot;, 0));
  });

  const versionRows = d3.select(&quot;#versions-table tbody&quot;).selectAll(&quot;tr&quot;)

  versionRows.append(&quot;td&quot;).text(d =&gt; d.model);
  [&quot;react&quot;, &quot;next&quot;, &quot;stripe&quot;].forEach(key =&gt; {

  const lookups = [
    {topic:&quot;Stripe&quot;, search:15, docs:4, local:3},
    {topic:&quot;Prodigi&quot;, search:23, docs:24, local:0},
    {topic:&quot;Framework&quot;, search:0, docs:0, local:1}

  lookups.forEach(d =&gt; d.total = d.search + d.docs + d.local);
  const keys = [&quot;search&quot;, &quot;docs&quot;, &quot;local&quot;];

  function renderLookup() {
    const svg = d3.select(&quot;#lookup-chart&quot;);
    const width = Math.max(620, svg.node().clientWidth || 900);
    const height = 238;
    const margin = {top: 18, right: 50, bottom: 42, left: 92};
    svg.attr(&quot;viewBox&quot;, `0 0 ${width} ${height}`).selectAll(&quot;*&quot;).remove();
    const x = d3.scaleLinear().domain([0, 50]).range([margin.left, width - margin.right]);
    const y = d3.scaleBand().domain(lookups.map(d =&gt; d.topic)).range([margin.top, height - margin.bottom]).padding(0.34);
    const stack = d3.stack().keys(keys)(lookups);

    svg.append(&quot;g&quot;).attr(&quot;class&quot;, &quot;axis&quot;)
      .attr(&quot;transform&quot;, `translate(0,${height - margin.bottom})`)
      .call(d3.axisBottom(x).ticks(5).tickSizeOuter(0))
      .call(g =&gt; g.append(&quot;text&quot;).attr(&quot;class&quot;, &quot;chart-label&quot;).attr(&quot;x&quot;, width - margin.right).attr(&quot;y&quot;, 34).attr(&quot;text-anchor&quot;, &quot;end&quot;).text(&quot;lookup events&quot;));
    svg.append(&quot;g&quot;).attr(&quot;class&quot;, &quot;axis&quot;)
      .attr(&quot;transform&quot;, `translate(${margin.left},0)`)
      .call(d3.axisLeft(y).tickSize(0).tickPadding(10))
      .call(g =&gt; g.select(&quot;.domain&quot;).remove());

    const seriesClass = {search:&quot;bar-search&quot;, docs:&quot;bar-doc&quot;, local:&quot;bar-local&quot;};
    svg.append(&quot;g&quot;).selectAll(&quot;g&quot;)
      .data(stack).join(&quot;g&quot;)
      .attr(&quot;class&quot;, d =&gt; seriesClass[d.key])
      .selectAll(&quot;rect&quot;)
      .data(d =&gt; d.map(v =&gt; ({...v, key:d.key, datum:v.data})))
      .join(&quot;rect&quot;)
      .attr(&quot;x&quot;, d =&gt; x(d[0]))
      .attr(&quot;y&quot;, d =&gt; y(d.datum.topic))
      .attr(&quot;width&quot;, d =&gt; Math.max(0, x(d[1]) - x(d[0])))
      .attr(&quot;height&quot;, y.bandwidth())
      .attr(&quot;rx&quot;, 2)
      .attr(&quot;tabindex&quot;, 0)
      .attr(&quot;aria-label&quot;, d =&gt; `${d.datum.topic}: ${d[1] - d[0]} ${d.key} events`)
      .on(&quot;mouseenter focus&quot;, (event, d) =&gt; tooltip.style(&quot;opacity&quot;, 1).html(`&lt;strong&gt;${d.datum.topic}&lt;/strong&gt;&lt;br&gt;${d.key === &quot;search&quot; ? &quot;Search queries&quot; : d.key === &quot;docs&quot; ? &quot;Document requests&quot; : &quot;Local reference reads&quot;}: ${d[1] - d[0]}`))
      .on(&quot;mousemove&quot;, event =&gt; tooltip.style(&quot;left&quot;, `${Math.min(event.clientX + 14, window.innerWidth - 294)}px`).style(&quot;top&quot;, `${event.clientY + 14}px`))
      .on(&quot;mouseleave blur&quot;, () =&gt; tooltip.style(&quot;opacity&quot;, 0));

    svg.append(&quot;g&quot;).selectAll(&quot;text&quot;)
      .data(lookups).join(&quot;text&quot;)
      .attr(&quot;class&quot;, &quot;bar-total&quot;)
      .attr(&quot;x&quot;, d =&gt; x(d.total) + 8)
      .attr(&quot;y&quot;, d =&gt; y(d.topic) + y.bandwidth()/2 + 4)
      .text(d =&gt; d.total);
  }
  renderLookup();
  new ResizeObserver(renderLookup).observe(document.querySelector(&quot;.suite-viz&quot;));
})();

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (event) =&gt; {
    for (const target of event.composedPath()) {
      if (target?.nodeType === Node.ELEMENT_NODE) {
        const trigger = target.closest(&quot;[data-tooltip]&quot;);
        if (trigger) return trigger;
      }
    }
    return null;
  };
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
